name: Build APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      test_version:
        description: Optional prerelease versionName, e.g. 2.5.7-offload-test1
        required: false
        type: string
      test_version_code:
        description: Optional versionCode for the test build; must exceed the stable versionCode
        required: false
        type: string

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Generate Gradle Wrapper
        run: gradle wrapper --gradle-version 8.13

      - name: Apply optional test version
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.test_version != '' }}
        env:
          TEST_VERSION: ${{ inputs.test_version }}
          TEST_VERSION_CODE: ${{ inputs.test_version_code }}
        run: |
          python3 <<'PY'
          import os
          import re
          from pathlib import Path

          version = os.environ["TEST_VERSION"].strip()
          if not re.fullmatch(r"\d+\.\d+\.\d+-[0-9A-Za-z][0-9A-Za-z.-]*", version):
              raise SystemExit("Test version must include a prerelease suffix")
          path = Path("app/build.gradle.kts")
          text = path.read_text(encoding="utf-8")
          base_code = int(re.search(r"versionCode\s*=\s*(\d+)", text).group(1))
          override = os.environ.get("TEST_VERSION_CODE", "").strip()
          if override:
              if not re.fullmatch(r"\d+", override) or int(override) <= base_code:
                  raise SystemExit(
                      f"test_version_code must be a whole number above the stable versionCode {base_code}"
                  )
              code = int(override)
          else:
              code = base_code + 1
          text = re.sub(r"versionCode\s*=\s*\d+", f"versionCode = {code}", text, count=1)
          text = re.sub(r'versionName\s*=\s*"[^"]+"', f'versionName = "{version}"', text, count=1)
          path.write_text(text, encoding="utf-8")
          print(f"Test APK: {version} ({code})")
          PY

      - name: Build Release APK
        run: ./gradlew :app:assembleRelease

      # The artifact is a signed release build; the name no longer claims "dev".
      # Note: the experimental governor (auto bitrate protection) defaults OFF at
      # runtime — users enable it from the module diagnostics page.
      - name: Prepare artifact name
        id: meta
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          DATE=$(date +'%Y%m%d')
          APK_NAME="OPlusHeadsetAudioHelper-${SHORT_SHA}-${DATE}.apk"
          echo "apk_name=${APK_NAME}" >> "$GITHUB_OUTPUT"

      - name: Sign APK
        uses: ilharp/sign-android-release@v2
        id: sign
        with:
          releaseDir: app/build/outputs/apk/release
          signingKey: ${{ secrets.SIGNING_KEY }}
          keyAlias: ${{ secrets.KEY_ALIAS }}
          keyStorePassword: ${{ secrets.KEY_STORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}
          buildToolsVersion: 35.0.0

      - name: Rename signed APK
        run: |
          SIGNED=$(find app/build/outputs/apk/release -name '*-signed.apk' | head -1)
          if [ -z "$SIGNED" ]; then
            echo "No signed APK found, falling back to unsigned"
            SIGNED=$(find app/build/outputs/apk/release -name '*.apk' | head -1)
          fi
          mv "$SIGNED" "app/build/outputs/apk/release/${{ steps.meta.outputs.apk_name }}"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.meta.outputs.apk_name }}
          path: app/build/outputs/apk/release/${{ steps.meta.outputs.apk_name }}
          retention-days: 30
